<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Orcane">
  <!-- Open ring, gap in the upper left where the fin sweeps in. -->
  <path d="M 34.1 24.6 A 30 30 0 1 1 20.0 50.0"
        fill="none" stroke="currentColor" stroke-width="7.4" stroke-linecap="round"/>
  <!-- The fin: sharp tip into the gap, tapering to a tail at the ring's edge. -->
  <path d="M 39.4 31.2 C 28.4 33.2 20.8 38.8 16.4 49.4 L 16.2 56.0 C 25.2 47.2 31.6 40.4 39.4 31.2 Z"
        fill="#1B3EF5"/>
</svg>
